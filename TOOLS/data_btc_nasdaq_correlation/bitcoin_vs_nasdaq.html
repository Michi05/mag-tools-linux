const $ = id => document.getElementById(id);
const statusEl = $("status");

/* ---------- helpers ---------- */
function isoWeekKey(d){
  const dt = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = (dt.getUTCDay() + 6) % 7;           // Mon=0 … Sun=6
  dt.setUTCDate(dt.getUTCDate() - day + 3);       // Thursday of this week
  const firstThu = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const fday = (firstThu.getUTCDay() + 6) % 7;
  firstThu.setUTCDate(firstThu.getUTCDate() - fday + 3);
  const week = 1 + Math.round((dt - firstThu) / 604800000);
  return dt.getUTCFullYear() + "-W" + String(week).padStart(2,"0");
}
function mondayOf(d){
  const dt = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  dt.setUTCDate(dt.getUTCDate() - (dt.getUTCDay()+6)%7);
  return dt.getTime()/1000; // unix seconds
}
function median(a){ const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }

/* ---------- Twelve Data (demo key: QQQ and BTC/USD are whitelisted, CORS enabled) ---------- */
async function twelveData(symbol){
  const u = "https://api.twelvedata.com/time_series?symbol="+encodeURIComponent(symbol)
          + "&interval=1week&outputsize=500&apikey=demo";
  const r = await fetch(u, {cache:"no-store"});
  if(!r.ok) throw new Error("TwelveData "+symbol+" HTTP "+r.status);
  const j = await r.json();
  if(!j.values) throw new Error("TwelveData "+symbol+": "+(j.message||"no values").slice(0,120));
  const m = new Map();
  for(const v of j.values){
    const d = new Date(v.datetime+"T12:00:00Z");
    m.set(isoWeekKey(d), {t:mondayOf(d), o:+v.open, h:+v.high, l:+v.low, c:+v.close});
  }
  return m;
}

/* ---------- BTC weekly OHLC ---------- */
async function fetchBTC(){
  const sources = [
    ["Binance", async()=>{
      const r = await fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1w&limit=500",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }],
    ["Binance (data mirror)", async()=>{
      const r = await fetch("https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1w&limit=500",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }],
  ];
  for(const [name,fn] of sources){
    try{
      const j = await fn();
      const m = new Map();
      for(const k of j){
        const d = new Date(k[0]);
        m.set(isoWeekKey(d), {t:mondayOf(d), o:+k[1], h:+k[2], l:+k[3], c:+k[4]});
      }
      if(m.size>10) return {map:m, src:name};
    }catch(e){ console.warn(name+" failed:", e); }
  }
  // Kraken fallback (CORS *, 720 weekly bars)
  try{
    const r = await fetch("https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=10080",{cache:"no-store"});
    const j = await r.json();
    if(j.error && j.error.length) throw new Error(j.error.join(","));
    const key = Object.keys(j.result).find(k=>k!=="last");
    const m = new Map();
    for(const k of j.result[key]){
      const d = new Date(k[0]*1000);
      m.set(isoWeekKey(d), {t:mondayOf(d), o:+k[1], h:+k[2], l:+k[3], c:+k[4]});
    }
    if(m.size>10) return {map:m, src:"Kraken"};
  }catch(e){ console.warn("Kraken failed:", e); }
  // Twelve Data fallback
  const m = await twelveData("BTC/USD");
  return {map:m, src:"Twelve Data BTC/USD"};
}

/* ---------- NDX weekly OHLC: embedded history + live QQQ extension ---------- */
function parseEmbedded(){
  const m = new Map();
  let lastKey = "";
  for(const row of NDX_EMBED.split(";")){
    const p = row.split(",");
    if(p.length<5) continue;
    const d = new Date(p[0]+"T12:00:00Z");
    const k = isoWeekKey(d);
    m.set(k, {t:mondayOf(d), o:+p[1], h:+p[2], l:+p[3], c:+p[4]});
    if(k>lastKey) lastKey = k;
  }
  return {map:m, lastKey};
}
async function fetchNDX(){
  const {map, lastKey} = parseEmbedded();
  let src = "^NDX embedded history";
  try{
    const qqq = await twelveData("QQQ");
    // Calibrate NDX ≈ K × QQQ from recent overlapping closed weeks (exclude the possibly-partial last embedded week)
    const ratios = [];
    const keys = [...map.keys()].sort();
    for(let i=keys.length-2; i>=0 && ratios.length<12; i--){
      const q = qqq.get(keys[i]);
      if(q) ratios.push(map.get(keys[i]).c / q.c);
    }
    if(ratios.length >= 5){
      const K = median(ratios);
      let extended = 0;
      for(const [wk,q] of qqq){
        if(wk >= lastKey){ // refresh stale last week + append new weeks
          map.set(wk, {t:q.t, o:q.o*K, h:q.h*K, l:q.l*K, c:q.c*K});
          extended++;
        }
      }
      src = "^NDX embedded + live QQQ×"+K.toFixed(2)+" (Twelve Data, "+extended+" wk refreshed)";
    }
  }catch(e){ console.warn("Live QQQ extension failed — showing embedded NDX history only:", e); }
  return {map, src};
}

/* ---------- build ratio candles (element-wise, like TradingView spreads) ---------- */
function buildRatio(btc, ndx){
  const out = [];
  for(const [wk,b] of btc){
    const n = ndx.get(wk);
    if(!n) continue;
    const o=b.o/n.o, h=b.h/n.h, l=b.l/n.l, c=b.c/n.c;
    out.push({time:b.t, open:o, high:Math.max(o,h,l,c), low:Math.min(o,h,l,c), close:c});
  }
  out.sort((a,b)=>a.time-b.time);
  return out;
}

/* ---------- chart ---------- */
let chart, series, priceLines=[], levelsOn=true;
const LS_KEY = "btc_ndx_levels";
function savedLevels(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||[]}catch(e){return[]} }
function saveLevels(v){ try{localStorage.setItem(LS_KEY, JSON.stringify(v))}catch(e){} }

function drawLevels(){
  priceLines.forEach(pl=>series.removePriceLine(pl));
  priceLines = [];
  if(!levelsOn) return;
  for(const price of savedLevels()){
    priceLines.push(series.createPriceLine({
      price, color:"#d32f2f", lineWidth:1, lineStyle:LightweightCharts.LineStyle.Solid,
      axisLabelVisible:true, title:""
    }));
  }
}

function initChart(data){
  chart = LightweightCharts.createChart($("chart"), {
    layout:{background:{color:"#0d0e12"}, textColor:"#c9cad1", fontSize:12},
    grid:{vertLines:{color:"#1b1d24"}, horzLines:{color:"#1b1d24"}},
    rightPriceScale:{borderColor:"#2a2c35", scaleMargins:{top:.08,bottom:.08}},
    timeScale:{borderColor:"#2a2c35", timeVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    autoSize:true,
  });
  series = chart.addCandlestickSeries({
    upColor:"#0e9d58", downColor:"#e0392f",
    wickUpColor:"#0e9d58", wickDownColor:"#e0392f",
    borderVisible:false,
    priceFormat:{type:"price", precision:3, minMove:0.001},
  });
  series.setData(data);
  chart.timeScale().fitContent();

  const last = data[data.length-1], prev = data[data.length-2];
  $("qVal").textContent = last.close.toFixed(3);
  if(prev){
    const pct = (last.close/prev.close - 1)*100;
    const el = $("qChg");
    el.textContent = (pct>=0?"+":"") + pct.toFixed(2) + "%";
    el.className = "chg " + (pct>=0?"up":"down");
  }

  chart.subscribeClick(param=>{
    if(!levelsOn || !param.point) return;
    const price = series.coordinateToPrice(param.point.y);
    if(price==null) return;
    const levels = savedLevels();
    const tol = Math.abs(series.coordinateToPrice(param.point.y+6) - price); // ~6px
    const near = levels.findIndex(p=>Math.abs(p-price)<=tol);
    if(near>=0) levels.splice(near,1); else levels.push(+price.toFixed(4));
    saveLevels(levels); drawLevels();
  });
  drawLevels();
}

/* ---------- controls ---------- */
$("btnLog").onclick = e=>{
  const on = e.target.classList.toggle("active");
  chart && chart.priceScale("right").applyOptions({mode: on ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal});
};
$("btnLines").onclick = e=>{
  levelsOn = e.target.classList.toggle("active");
  e.target.textContent = "Levels: " + (levelsOn?"ON":"OFF");
  drawLevels();
};
$("btnClear").onclick = ()=>{ saveLevels([]); drawLevels(); };
$("btnReload").onclick = ()=>location.reload();

/* ---------- main ---------- */
(async ()=>{
  try{
    statusEl.textContent = "Fetching BTC weekly candles…";
    const btc = await fetchBTC();
    statusEl.textContent = "Fetching Nasdaq-100 weekly data…";
    const ndx = await fetchNDX();
    const data = buildRatio(btc.map, ndx.map);
    if(data.length < 10) throw new Error("Could not align enough weeks between the two series ("+data.length+")");
    statusEl.innerHTML = "Showing <b>"+data.length+"</b> weekly candles · BTC: <span class='src'>"+btc.src+"</span> · NDX: <span class='src'>"+ndx.src+"</span>";
    $("srcInfo").textContent = "Last update: " + new Date().toLocaleString();
    initChart(data);
  }catch(e){
    statusEl.textContent = "Failed to load data.";
    const err = $("err"); err.style.display="block";
    err.textContent = "Error: " + e.message + "\n\nCheck your internet connection and press Reload to retry.";
    console.error(e);
  }
})();
